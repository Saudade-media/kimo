name: Feature request
description: Suggest an idea or improvement for Kimo.
labels: [enhancement, needs triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Canvas / editing
        - Layout
        - Components / tokens
        - AI agent / MCP
        - Export
        - .kimo file format
        - Desktop
        - Other
