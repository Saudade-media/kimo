version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      bun-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # 2.6.2 does not compile against rust-ini 0.21.3; single-instance 2.5.4 requires it
      - dependency-name: tauri-plugin-deep-link
        versions: ["2.6.2"]
      - dependency-name: tauri-plugin-single-instance
        versions: ["2.5.4"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
