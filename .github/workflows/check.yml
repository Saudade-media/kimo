# Every push to main and every pull request: the same gate as `bun run check`, plus the example
# documents, the exporters' box-diff harness and the browser e2e smoke set (core flows only, on
# Linux). Rust lives in rust.yml.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Playwright browsers in a fixed place so the cache key below matches.
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright

jobs:
  check:
    name: lint, typecheck, generated, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json # reads the root "packageManager" field
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run check:generated
      - run: bun run test
      - name: examples (reproducible + kimo validate --strict)
        run: bun run check:examples
      - name: build web app
        run: bun run --filter @kimo/web build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7

  # The browser smoke set (apps/web/e2e): canvas, text and pen, and share and join against a real
  # local relay, in headless Chromium. The scenarios assert document state, not pixels, so they
  # run on Linux. One retry; a scenario that passes on retry is reported as a warning. Locally:
  # `bun run --filter @kimo/web e2e [name filter]`.
  e2e:
    name: e2e (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # The Playwright driver runs under Node via tsx (apps/web/e2e/run.ts explains why).
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: playwright version
        id: pw
        working-directory: apps/web
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: pw-cache
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - name: install Chromium
        working-directory: apps/web
        env:
          CACHE_HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            bunx playwright install-deps chromium
          else
            bunx playwright install --with-deps chromium
          fi
      - name: smoke scenarios
        working-directory: apps/web
        env:
          KIMO_E2E_SHOTS: ${{ runner.temp }}/e2e-shots
        run: bun run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-failures
          path: ${{ runner.temp }}/e2e-shots
          if-no-files-found: ignore
          retention-days: 14

  # Pull requests that touch nothing the exported HTML depends on skip the harness; the job still
  # reports success, so it stays a required check.
  exporters-boxdiff:
    name: exporters box-diff
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: changed paths
        id: changes
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE"
          if git diff --name-only "$BASE" HEAD |
            grep -qE '^(packages/(exporters|layout|renderer|core-schema)/|bun\.lock$|package\.json$|\.github/workflows/check\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No change to the export pipeline: box diff skipped."
          fi
      - uses: oven-sh/setup-bun@v2
        if: steps.changes.outputs.run != 'false'
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
        if: steps.changes.outputs.run != 'false'
      - name: playwright version
        if: steps.changes.outputs.run != 'false'
        id: pw
        working-directory: packages/exporters
        run: echo "version=$(bun -e "console.log(require('playwright/package.json').version)")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        if: steps.changes.outputs.run != 'false'
        id: pw-cache
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - name: install Chromium
        if: steps.changes.outputs.run != 'false'
        working-directory: packages/exporters
        env:
          CACHE_HIT: ${{ steps.pw-cache.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            bunx playwright install-deps chromium
          else
            bunx playwright install --with-deps chromium
          fi
      - name: box diff (exported HTML vs layout, every fixture)
        if: steps.changes.outputs.run != 'false'
        run: bun run --filter @kimo/exporters verify
      - uses: actions/upload-artifact@v7
        if: always() && steps.changes.outputs.run != 'false'
        with:
          name: exporters-boxdiff
          path: packages/exporters/harness/out
          if-no-files-found: ignore
          retention-days: 14
