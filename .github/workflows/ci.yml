name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json # reads the root "packageManager" field
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run check:generated
      - run: bun run test
      - run: bun run --filter @kimo/web build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7

  desktop:
    name: desktop
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # tauri::generate_context! embeds frontendDist (apps/web/dist) at compile time,
      # so reuse the web build from the check job instead of rebuilding it here.
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: cargo check
        working-directory: apps/desktop/src-tauri
        run: cargo check --locked
