# The relay image (apps/server/Dockerfile) on GitHub Container Registry: ghcr.io/saudade-media/kimo-relay
# for linux/amd64 and linux/arm64. Pushes to main publish `latest`, `main` and `sha-<short>`;
# pushes to multiplayer publish `multiplayer` and `sha-<short>` (until it merges into main);
# version tags (v1.2.3) publish `1.2.3` and `1.2`. Pull requests only build it. The relay setup
# wizard's docker run command, the Fly.io config and the Railway template all use this image.
name: relay-image

on:
  push:
    branches: [main, multiplayer]
    tags: ["v*"]
  pull_request:
    paths:
      - "apps/server/**"
      - "packages/sync/**"
      - ".github/workflows/relay-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: relay-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/saudade-media/kimo-relay

jobs:
  image:
    name: build and publish kimo-relay
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - name: log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=kimo-relay
            org.opencontainers.image.description=Kimo blind multiplayer relay (kimo-mp/1)
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
