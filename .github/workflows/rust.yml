# The Tauri app and the kimo-mcp shim (one Cargo workspace): rustfmt, clippy with warnings denied,
# and the test suites. Pull requests and main run on Linux only; a `v*` tag (and a manual run)
# adds macOS and Windows, next to the release builds that compile every platform anyway.
name: rust

on:
  push:
    branches: [main]
    paths:
      - apps/desktop/src-tauri/**
      - .github/workflows/rust.yml
    # Path filters don't apply to tag pushes: every release tag runs the full matrix.
    tags: ["v*"]
  pull_request:
    paths:
      - apps/desktop/src-tauri/**
      - .github/workflows/rust.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

defaults:
  run:
    shell: bash
    working-directory: apps/desktop/src-tauri

jobs:
  rust:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.ref_type == 'tag' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Linux system libraries (WebKitGTK 4.1, libsoup 3, appindicator)
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev \
            build-essential patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      # tauri::generate_context! embeds build.frontendDist (apps/web/dist) at compile time. The
      # Rust checks don't need the real web app, so a placeholder page stands in for it.
      - name: placeholder frontendDist
        working-directory: .
        run: |
          mkdir -p apps/web/dist
          [ -f apps/web/dist/index.html ] || echo '<!doctype html><title>Kimo</title>' > apps/web/dist/index.html
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --workspace --locked
