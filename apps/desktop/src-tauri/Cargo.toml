[package]
name = "kimo-desktop"
version = "1.0.0"
description = "Kimo desktop shell"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"
publish = false

# `kimo-mcp` (the stdio shim bundled in the app, ADR 0008 / 0013 §7) shares this lockfile, target
# dir and release profile. The app uses its library for the kimo-socket/1 protocol pieces.
[workspace]
members = ["kimo-mcp"]

[lib]
# `_lib` suffix avoids a name clash with the bin target on Windows (cargo#8519).
name = "kimo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
base64 = "0.23"
notify = "8"
notify-debouncer-full = "0.7"
fontdb = "0.24"
ttf-parser = "0.25"
url = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
gethostname = "1"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# M5 MCP relay (ADR 0013 §7): socket/pipe + loopback Streamable HTTP listeners.
kimo-mcp = { path = "kimo-mcp" }
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros", "rt"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
getrandom = "0.4"
# M6 (ADR 0014 §4): HMAC (Bedrock SigV4) and RS256 (Vertex service-account ADC).
ring = "0.17"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# Board 32 "Dock activity": the animated Dock tile (NSDockTile content view, reduce-motion check).
# Board 37 §3 Move to Trash (NSFileManager trashItemAtURL), Help › Copy diagnostics (NSPasteboard).
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSError", "NSFileManager", "NSGeometry", "NSProcessInfo", "NSURL", "NSUserDefaults", "NSString"] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSAccessibility",
  "NSApplication",
  "NSControl",
  "NSDockTile",
  "NSImage",
  "NSImageView",
  "NSPasteboard",
  "NSResponder",
  "NSView",
  "NSWindow",
  "NSButton",
  "NSWorkspace",
] }
# M6 provider keys in the OS keychain (service "kimo", account "provider.<id>").
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(windows)'.dependencies.keyring]
version = "3.6"
features = ["windows-native"]

[target.'cfg(target_os = "linux")'.dependencies.keyring]
version = "3.6"
# Secret Service over zbus (pure Rust: no libdbus at build time).
features = ["async-secret-service", "tokio", "crypto-rust"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
