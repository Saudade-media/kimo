[package]
name = "kimo-desktop"
version = "0.0.0"
description = "Kimo desktop shell"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
# `_lib` suffix avoids a name clash with the bin target on Windows (cargo#8519).
name = "kimo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
