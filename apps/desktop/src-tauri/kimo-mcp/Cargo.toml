[package]
name = "kimo-mcp"
version = "1.2.1-beta.1"
description = "Kimo MCP stdio shim: relays an agent host's stdio to the running Kimo app over kimo-socket/1 (ADR 0008, 0013 §7)"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"
publish = false

# The library holds the kimo-socket/1 protocol pieces shared with the desktop app (constants,
# hello types, framing, ~/.kimo paths). The binary is the shim bundled inside the app.
[lib]
name = "kimo_mcp"
path = "src/lib.rs"

[[bin]]
name = "kimo-mcp"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }
tokio = { version = "1", features = ["net", "rt", "io-util", "sync", "time", "macros"] }

[dev-dependencies]
tempfile = "3"
