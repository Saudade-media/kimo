# Example Fly.io config for a Kimo relay you run yourself. Edit `app` first (names are global).
# Deploy from the repository root:
#   fly launch --copy-config --config apps/server/deploy/fly.toml --dockerfile apps/server/Dockerfile --no-deploy
#   fly volumes create kimo_data --size 1 --region iad
#   fly secrets set KIMO_CREATE_SECRET="$(openssl rand -hex 24)"
#   fly deploy --config apps/server/deploy/fly.toml --dockerfile apps/server/Dockerfile .
# Keep exactly one machine: the relay stores rooms in a local SQLite file on the volume.
app = "my-kimo-relay"
primary_region = "iad"

[env]
  HOST = "0.0.0.0"
  PORT = "8787"
  KIMO_DATA_DIR = "/data"
  KIMO_TRUST_PROXY = "1"

[mounts]
  source = "kimo_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  # WebSockets stay open for hours: never stop the machine on idle.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    timeout = "3s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
