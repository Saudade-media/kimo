    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />

    <meta name="theme-color" content="#0A0A0A" />
    <title>Kimo</title>
    <!--
      Launch loader (desing.pen board 29 "Launch loader", vIK2m): static markup + CSS so it is on
      screen at first paint, before the app bundle loads. launch.js is a same-origin classic script
      (the desktop CSP allows script-src 'self', not inline scripts): it copies the stored theme onto
      <html data-theme> and turns the loader off in the hidden document host. The mark's path is
      KIMO_LOGO_PATH (packages/ui/src/kimo-logo/paths.ts); keep the two equal.
      apps/web/src/launch-loader.ts sets the status line and fades the layer out after mount.
    -->
    <script src="/launch.js"></script>
    <style>
      #kimo-launch {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background: #ffffff;
        color: #0a0a0a;
        pointer-events: none;
        opacity: 1;
        transition: opacity 180ms ease-out;
      }
      #kimo-launch.is-leaving {
        opacity: 0;
      }
      html[data-launch="off"] #kimo-launch {
        display: none;
      }
      .kimo-launch__center {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        animation: kimo-launch-enter 200ms ease-out both;
      }
      .kimo-launch__mark {
        display: block;
        width: 64px;
        height: 64px;
        transform-origin: 50% 50%;
        animation: kimo-launch-turn 1600ms infinite;
      }
      .kimo-launch__status {
        margin: 0;
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        font-weight: 400;
        line-height: 1.45;
        white-space: nowrap;
        color: #9a9da2;
        opacity: 0;
        animation: kimo-launch-enter 200ms ease-out 3000ms both;
      }
      html[data-theme="dark"] #kimo-launch {
        background: #0a0a0a;
        color: #f5f5f4;
      }
      html[data-theme="dark"] .kimo-launch__status {
        color: #6b6b6b;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) #kimo-launch {
          background: #0a0a0a;
          color: #f5f5f4;
        }
        html:not([data-theme="light"]) .kimo-launch__status {
          color: #6b6b6b;
        }
      }
      @keyframes kimo-launch-enter {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes kimo-launch-turn {
        0% {
          transform: rotate(0deg) scale(1);
          animation-timing-function: cubic-bezier(0.32, 0, 0.67, 0);
        }
        31.25% {
          transform: rotate(90deg) scale(0.88);
          animation-timing-function: cubic-bezier(0.33, 1, 0.68, 1);
        }
        62.5%,
        100% {
          transform: rotate(180deg) scale(1);
        }
      }
      @keyframes kimo-launch-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.6;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .kimo-launch__mark {
          animation: kimo-launch-pulse 2400ms ease-in-out infinite;
        }
      }
    </style>
  </head>
