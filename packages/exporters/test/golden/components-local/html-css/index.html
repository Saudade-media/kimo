<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local components</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
    <section class="k-screen" data-layer="Screen" data-kimo-theme="">
      <div class="k-toolbar" data-layer="Toolbar">
        <div class="k-first" data-layer="First">
          <svg class="k-glyph" data-layer="Glyph" viewBox="0 0 20 20" overflow="visible" aria-hidden="true">
            <g transform="matrix(0.833 0 0 0.833 0 0)"><path d="M4 4H20V20H4Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g>
          </svg>
        </div>
        <div class="k-extra" data-layer="Extra">
          <div class="k-search" data-layer="Search">
            <svg class="k-glyph-2" data-layer="Glyph" viewBox="0 0 20 20" overflow="visible" aria-hidden="true">
              <g transform="matrix(0.833 0 0 0.833 0 0)"><path d="M4 4H20V20H4Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g>
            </svg>
            <div class="k-badge" data-layer="Badge"></div>
          </div>
          <div class="k-share" data-layer="Share">
            <svg class="k-glyph-3" data-layer="Glyph" viewBox="0 0 20 20" overflow="visible" aria-hidden="true">
              <g transform="matrix(0.833 0 0 0.833 0 0)"><path d="M4 4H20V20H4Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></g>
            </svg>
            <div class="k-badge-2" data-layer="Badge"></div>
          </div>
        </div>
        <p class="k-title" data-layer="Title">Inbox</p>
      </div>
    </section>
</body>
</html>
