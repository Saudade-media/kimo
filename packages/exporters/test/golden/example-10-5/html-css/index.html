<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kimo landing</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
    <section class="k-hero" data-layer="Hero" data-kimo-theme="" data-mode="light" data-ui-mode="light">
      <p class="k-title" data-layer="Title">Design next to your code</p>
      <div class="k-actions" data-layer="Actions">
        <div class="k-primary-cta" data-layer="Primary CTA"><p class="k-label" data-layer="Label">Get Kimo — $49/mo</p></div>
      </div>
      <div class="k-feature-card" data-layer="Feature card" data-kimo-theme="" data-mode="dark" data-ui-mode="light">
        <p class="k-title-2" data-layer="Title">Card title</p>
        <div class="k-actions-2" data-layer="Actions">
          <div class="k-button-primary" data-layer="Button/Primary"><p class="k-label-2" data-layer="Label">Learn more</p></div>
        </div>
      </div>
      <div class="k-screenshot" data-layer="Screenshot"></div>
    </section>
</body>
</html>
