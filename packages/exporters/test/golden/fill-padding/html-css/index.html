<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fill padding</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
    <section class="k-board" data-layer="Board" data-kimo-theme="">
      <div class="k-padded-fills" data-layer="Padded fills">
        <div class="k-padded-a" data-layer="Padded A"><p class="k-text">Padded twenty on each side</p></div>
        <div class="k-padded-b" data-layer="Padded B"><p class="k-text-2">Short</p></div>
        <div class="k-unpadded" data-layer="Unpadded"><p class="k-text-3">No padding here, so this text would wrap sooner if the column were narrower</p></div>
      </div>
      <div class="k-weights-and-stroke" data-layer="Weights and stroke"><div class="k-weight-2-padded" data-layer="Weight 2 padded"></div><div class="k-weight-1" data-layer="Weight 1"></div><div class="k-max-padded" data-layer="Max padded"></div></div>
    </section>
</body>
</html>
