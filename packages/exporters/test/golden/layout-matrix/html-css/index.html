<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Layout matrix</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
    <section class="k-matrix" data-layer="Matrix" data-kimo-theme="">
      <div class="k-row" data-layer="Row"><div class="k-rect"></div><div class="k-rect-2"></div><div class="k-rect-3"></div><div class="k-rect-4"></div><div class="k-absolute" data-layer="Absolute"></div></div>
      <div class="k-column" data-layer="Column"><div class="k-rect-5"></div><div class="k-rect-6"></div><div class="k-rect-7"></div></div>
      <div class="k-evenly" data-layer="Evenly"><div class="k-rect-8"></div><div class="k-rect-9"></div></div>
      <div class="k-min-max" data-layer="Min max"><div class="k-rect-10"></div></div>
      <div class="k-box-fit" data-layer="Box fit"><div class="k-rect-11"></div><div class="k-rect-12"></div></div>
      <div class="k-empty-fallback" data-layer="Empty fallback"></div>
      <div class="k-group" data-layer="Group"><div class="k-rect-13"></div><div class="k-ellipse"></div></div>
      <div class="k-around" data-layer="Around">
        <div class="k-rect-14"></div>
        <div class="k-nested-fit" data-layer="Nested fit"><div class="k-rect-15"></div><div class="k-rect-16"></div></div>
      </div>
    </section>
</body>
</html>
