<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Text styles</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
    <section class="k-text" data-layer="Text" data-kimo-theme="" data-mode="light">
      <h1 class="k-heading" data-layer="Heading">Export exactly</h1>
      <p class="k-runs" data-layer="Runs"><span>Mixed </span><span class="k-runs-r2">bold</span><span> and </span><a class="k-runs-r4" href="https://getkimo.design">linked</a><span> runs in one paragraph.</span></p>
      <p class="k-decorated" data-layer="Decorated">Underlined, struck, italic, tabular 0123</p>
      <div class="k-dark-card" data-layer="Dark card" data-kimo-theme="" data-mode="dark"><p class="k-dark-title" data-layer="Dark title">On dark</p></div>
    </section>
</body>
</html>
